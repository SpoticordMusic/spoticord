[package]
name = "spoticord-player"
version.workspace = true
edition = "2024"

[dependencies]
spoticord-ipc = { path = "../../crates/ipc" }
spoticord-shared = { path = "../../crates/shared" }

anyhow = "1.0.100"
async-trait = "0.1.89"
env_logger = "0.11.8"
librespot = { git = "https://github.com/librespot-org/librespot.git", default-features = false, features = [
    "rustls-tls-native-roots",
] }
log = "0.4.28"
songbird = { version = "0.5.0", features = [
    "driver",
    "rustls",
    "tungstenite",
    "gateway",
] }
tokio = { version = "1.48.0", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
] }
tokio-stream = "0.1.17"
zerocopy = "0.8.30"
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
rustls = { version = "0.23.35", features = ["aws-lc-rs"] }

[package.metadata.cargo-machete]
ignored = [
    "symphonia", # PCM feature needs to be explicitly enabled to use RawAdapter
]
