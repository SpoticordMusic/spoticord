[package]
name = "spoticord-ipc"
edition = "2024"
version.workspace = true

[dependencies]
spoticord-shared = { path = "../shared" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "rt"] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
log = "0.4.29"
